# Lee la cotización del dólar billete del BROU (compra y venta) los días hábiles
# y la guarda en public/rates/. Si la lectura falla, no toca nada (queda el último
# valor válido) y deja un aviso en el log. Si hubo cambios, vuelve a publicar la app.
name: Cotización BROU

on:
  schedule:
    # Montevideo es UTC−3: 10:30, 13:00 y 16:30, de lunes a viernes.
    - cron: '30 13 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '30 19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # para guardar los archivos de cotización
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # El script no usa dependencias externas: no se instala nada de npm en este job.
      - id: fetch
        name: Leer cotización del BROU
        run: node scripts/fetch-brou.mjs
      - name: Guardar cambios
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rates/latest.json public/rates/history.json
          git commit -m "Cotización BROU $(TZ=America/Montevideo date +%Y-%m-%d)"
          git push

  # Un push hecho por el Action no dispara otros workflows: la publicación se llama a mano.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
